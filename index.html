<!DOCTYPE html>
<html lang="ja">

<head>
    <title>sgnjoy</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="bmstable" content="header.json" />
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }

        .navbar {
            background-color: #1f1f1f !important;
        }

        .alert-success {
            background-color: #0d2b78;
            color: #ffffff;
            border-color: #2f6fad;
        }

        .table-dark {
            background-color: #181818 !important;
            color: #e0e0e0;
        }

        .table-dark thead {
            background-color: #222 !important;
        }

        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #1d1d1d;
        }

        .table-hover tbody tr:hover {
            background-color: #262f3a;
        }

        .table-dark td,
        .table-dark th {
            border-color: #2a2a2a;
        }

        /* レベル区切り専用 */
        .level-sep {
            background-color: #1f1f1f !important;
            border-top: 2px solid #2f6fad;
            text-align: center;
            font-weight: bold;
        }

        a {
            color: #66b3ff;
        }

        a:hover {
            color: #9fd0ff;
        }
        .comment-tag {
    color: #ff3b3b;
    font-weight: bold;
}
.rec-title {
    font-weight: bold;
    text-shadow: 0 0 1px rgba(255,255,255,0.3);
}
        .tn-low {
    color: #ff4d4d;
    font-weight: bold;
}

.tn-high {
    color: #66ccff;
    font-weight: bold;
}

        .link-selected {
    font-weight: bold;
    color: #ffffff !important;
    text-decoration: none;
}
    </style>
</head>

<body>
    <header class="mb-3">
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">sgnjoy</span>
            </div>
        </nav>
    </header>

    <div class="container">

        <div class="alert alert-success mb-3" role="alert">
            <p>obj:sgn名義で作った差分をまとめた難易度表です</p>
            <p>急に難易度が変わったりすることがありますがご了承ください</p>
            <p>レベル設定はかなりガバガバなので注意</p>
            <hr>
            <p class="mb-0">sg0 = st0 ／ sg-1 = sl12　　タイトルが太字の差分は個人的におすすめの差分です</p>
        </div>

        <div class="mb-3">
    <b>リンク先：</b>
    <a href="#" id="mode-mocha">Mocha</a>
    /
    <a href="#" id="mode-bmsir">BMS-IR</a>
</div>

        <div>
            <table class="table table-dark table-striped table-hover table-sm" id="table_int">
            </table>
        </div>

        <script>
            $(document).ready(function () {
                $(document).on("click", "#mode-mocha", function(e) {
    e.preventDefault();
    localStorage.setItem("linkMode", "mocha");
    location.reload();
});

$(document).on("click", "#mode-bmsir", function(e) {
    e.preventDefault();
    localStorage.setItem("linkMode", "bmsir");
    location.reload();
});

updateLinkModeUI();
                $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {
                $.getJSON(header.data_url, function (information) {

                    information.sort(function(a, b) {
                        if (a.level !== b.level) {
                            return a.level - b.level;
                        }
                        return a.title.localeCompare(b.title, 'ja', { sensitivity: 'base' });
                    });

                    makeBMSTable(information, header.symbol);
                });
                });
            });

function getTitleLink(song) {
    const mode = localStorage.getItem("linkMode") || "mocha";

    if (mode === "bmsir") {
        if (song.md5) {
            return "https://bms-ir.org/new/song?songmd5=" +
                song.md5 +
                "&view=new";
        }

        return "https://bms-ir.org/";
    }

    return "https://mocha-repository.info/song.php?sha256=" +
        song.sha256;
}

function updateLinkModeUI() {
    const mode = localStorage.getItem("linkMode") || "mocha";

    $("#mode-mocha").toggleClass("link-selected", mode === "mocha");
    $("#mode-bmsir").toggleClass("link-selected", mode === "bmsir");
}
            
            function makeBMSTable(info, mark) {
    const obj = $("#table_int");

    let html = `
        <thead class="table-dark">
            <tr>
                <th>Level</th>
                <th>Title</th>
                <th>Artist</th>
                <th>BPM</th>
                <th>Notes</th>
                <th>T/N</th>
                <th>Song</th>
                <th>Chart</th>
                <th>Comment</th>
            </tr>
        </thead>
        <tbody>
    `;

    let currentLevel = null;
    let levelStartIndex = 0;

    for (let i = 0; i < info.length; i++) {

        if (currentLevel !== info[i].level) {

            if (currentLevel !== null) {
                html += `
                    <tr class="level-sep">
                        <td colspan="9">
                            <b>${mark}${currentLevel} (${i - levelStartIndex}譜面)</b>
                        </td>
                    </tr>
                `;
            }

            levelStartIndex = i;
            currentLevel = info[i].level;

            html += `<tr data-level-start="${currentLevel}"></tr>`;
        }

        const recClass =
            info[i].recommend && info[i].recommend.trim() !== ""
                ? "rec-title"
                : "";

        let tn = "";
        let tnClass = "";

        if (
            info[i].total != null &&
            info[i].notes != null &&
            info[i].notes !== 0
        ) {
            const tnValue = info[i].total / info[i].notes;
            tn = tnValue.toFixed(3);

            if (tnValue <= 0.175) {
                tnClass = "tn-low";
            } else if (tnValue >= 0.220) {
                tnClass = "tn-high";
            }
        }

        const diff = info[i].table || "";
        const comment = info[i].comment || "";

        const finalComment =
            (diff.trim()
                ? `[<span class="comment-tag">${diff}</span>] `
                : "") + comment;

        html += `
            <tr>
                <td width="5%">${mark}${info[i].level}</td>

                <td width="30%">
                    <a class="${recClass}"
                       href="${getTitleLink(info[i])}"
                       target="_blank">
                        ${info[i].title}
                    </a>
                </td>

                <td width="20%">${info[i].artist}</td>
                <td width="7%">${info[i].bpm}</td>
                <td width="5%">${info[i].notes}</td>

                <td width="5%" class="${tnClass}">
                    ${tn}
                </td>

                <td width="5%">
                    <a href="${info[i].url}" target="_blank">DL</a>
                </td>

                <td width="5%">
                    ${
                        info[i].url_diff &&
                        info[i].url_diff.trim() !== ""
                            ? `<a href="${info[i].url_diff}" target="_blank">DL</a>`
                            : ""
                    }
                </td>

                <td width="18%">
                    ${finalComment}
                </td>
            </tr>
        `;
    }

    if (currentLevel !== null) {
        html += `
            <tr class="level-sep">
                <td colspan="9">
                    <b>${mark}${currentLevel} (${info.length - levelStartIndex}譜面)</b>
                </td>
            </tr>
        `;
    }

    html += "</tbody>";

    obj.html(html);

    $(".level-sep").each(function () {
        const prev = $(this).prevAll("tr:not(.level-sep)").first();

        if (prev.length) {
            const level = prev.find("td:first").text().replace(mark, "");
            const count = prev
                .nextUntil(".level-sep")
                .length + 1;

            $(this).html(
                `<td colspan="9"><b>${mark}${level} (${count}譜面)</b></td>`
            );
        }
    });
}
        </script>
    </div>

</body>

</html>
